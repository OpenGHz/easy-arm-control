# Formatting is owned by this file: run `pre-commit run --all-files`.
# Install the git hook once with `pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: fix-byte-order-marker
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # Python/notebook whitespace is handled by ruff-format, which never
      # touches the contents of non-docstring string literals.
      - id: trailing-whitespace
        exclude: \.(py|ipynb)$
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Lint only for bug-class rules (see ruff.toml); never auto-fix.
      - id: ruff-check
        args: [--no-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.2
    hooks:
      - id: nbstripout
